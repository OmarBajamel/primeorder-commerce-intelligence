services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATA_MODE: public-demo
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh -c "corepack enable && pnpm install && pnpm data:generate && pnpm dev:web --hostname 0.0.0.0"
    environment:
      DATA_MODE: public-demo
    ports:
      - "3000:3000"
    depends_on:
      - api
