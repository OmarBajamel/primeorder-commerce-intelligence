services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATA_MODE: public-demo
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATA_MODE: public-demo
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
