name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/generate_demo_data.py
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter web build
        env:
          DATA_MODE: public-demo

  python-api:
    name: Python and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/generate_demo_data.py
      - run: python -m pytest services/api/tests connectors/tests scripts/tests -q

  analytics:
    name: dbt analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python scripts/generate_demo_data.py
      - run: dbt parse --project-dir analytics --profiles-dir analytics
      - run: dbt build --project-dir analytics --profiles-dir analytics

  browser-and-release:
    name: Browser, accessibility, and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/generate_demo_data.py
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATA_MODE: public-demo
      - run: pnpm --filter web build
        env:
          DATA_MODE: public-demo
          NEXT_PUBLIC_BASE_PATH: /primeorder-commerce-intelligence
      - run: pnpm test:static
      - run: python scripts/release_check.py
        env:
          DATA_MODE: public-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip_audit -r requirements.lock

  container-smoke:
    name: Container build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --detach
      - name: Wait for API and web
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down --volumes
